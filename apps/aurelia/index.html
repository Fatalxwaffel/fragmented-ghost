    #loading-orbit::before,

      height: 2px;
      margin-top: 20px;
      overflow: hidden;
      background-color: rgba(132, 225, 255, .12);
    }
    #progress {
      position: absolute;
      inset: 0;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.22s ease;
      background: linear-gradient(90deg, #61dfff, #6bffd1);
      box-shadow: 0 0 12px rgba(98, 239, 255, .55);
